<!DOCTYPE html>
<html>
    <title> Game Prototype
    By: Yohanes</title>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: fixed;
  touch-action: none
  
  #bg-layar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;  
  height: 100vh; 
  background-color: cyan; 
  z-index: -1;
}
  .dunia {
  width: 100%;
  height: 300px;
  position: relative;
  overflow: hidden;}
  
  .back{
    background-color: cyan;
    width: 700px;
      height: 550px;
      left: -10px;
      top: 50px;
      position: absolute;
      background-image: url('background.jpg');
      background-repeat: repeat-x;
      background-size: contain;
  }

  .tanah{
    background-color: brown;
    height: 700px;
    width: 452px;
    left: 0px;
    top: 500px;
    position: absolute;
    background-repeat: repeat-x;
    background-size: contain;
    
  }
    .char {
  width: 120px;
  height: 120px;
  position: absolute;
  left: 50px;
  top: 210px;
  background-image: url('karakter3.png');
  background-repeat: no-repeat;
  background-size: contain;
  background-position: center;
  
  z-index: 99;
}

    .button1{
      width: 80px;
      height: 80px;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn-kanan{
      left: 290px;
      top: 500px;
    }
    .btn-kiri{
      left: 0px;
      top: 500px;
    }
  </style>
  </head>
  <body> <div class = "layar-awal" id ="main-menu">

  <div class="bg-layar"></div>
  

  <div id="world">
  <div class = "back" id="back"></div>

  <div class="tanah" id="tanah"></div>
  <div class ="char" id="kar"></div>
  </div>
  </div>
  </div>
    

    <button class = "button1 btn-kanan"
            ontouchstart="mulai()"
            ontouchend="stop()"
            oncontextmenu="return false;"
            >></button>
    <button class = "button1 btn-kiri"
            ontouchstart="mulai1()"
            ontouchend="stop1()"
            oncontextmenu="return false;"
            ><</button>
  </body>
  <script>
  
    let run = 0;
    let timer = null;
    let bgPos = 0;
    let lebarFotoLatar = 700;
    
    let charElem = document.querySelector('.char');
    let direction = 1;
    
    let sfxLangkah = new Audio('langkah.mp3'); 
    sfxLangkah.loop = true;
    sfxLangkah.preload = 'auto';
    








  
    function jalan(){
      
      
      run = run + 10;
      direction = 1;
      bgPos = -((run % lebarFotoLatar + lebarFotoLatar) % lebarFotoLatar);
      
      
      
      
      
      update();
    }
    function mundur(){
      
      run = run - 10;
      direction = -1;
      bgPos = -((run % lebarFotoLatar + lebarFotoLatar) % lebarFotoLatar);
      

      

      
      
      update();
    }
    function resetChar() {
  document.querySelector('.char').style.backgroundImage = "url('karakter3.png')";
}

    function mulai(){
      if (timer !== null)return;
      
  
      timer=setInterval(jalan,50);
      sfxLangkah.currentTime = 0;
  sfxLangkah.play();
      
    }
    function mulai1(){
      if (timer !== null)return;

      timer=setInterval(mundur,50);
      sfxLangkah.currentTime = 0;
  sfxLangkah.play();
      
    }
    function stop() {
  clearInterval(timer);
  timer = null;
  resetChar()
  
  sfxLangkah.pause();
  
  
}

function stop1() {
  clearInterval(timer);
  timer = null;
  resetChar()
  
  sfxLangkah.pause();
  
  
}

function prepareAudio() {
  sfxLangkah.play().then(() => {
    sfxLangkah.pause();
    sfxLangkah.currentTime = 0;
  }).catch(() => {});
}

    function update() {
  document.getElementById("back").style.backgroundPositionX = bgPos + "px";
  document.getElementById("tanah").style.backgroundPositionX = bgPos + "px";


  let charStyle = document.querySelector('.char').style;
  if (direction === -1) {
    charStyle.transform = "scaleX(-1)";
  } else {
    charStyle.transform = "scaleX(1)";
  }


  if (timer === null) {
    resetChar();
    return;
  }

  let frame = Math.floor(Math.abs(run) / 25) % 3;

  if (frame === 0) {
    charStyle.backgroundImage = "url('karakter.png')";
  } else if (frame === 1) {
    charStyle.backgroundImage = "url('karakter2.png')";
  } else if (frame === 2) {
    charStyle.backgroundImage = "url('karakter3.png')";
  }
}




window.addEventListener('touchstart', function() {
  prepareAudio();
}, { once: true });

  </script>
</html>
